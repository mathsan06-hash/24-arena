name: Android paketi

# Elle çalıştırılır (Actions > Android paketi > Run workflow).
# Play Store için imzasız AAB üretir ve android-build dalına koyar; imzalama ayrıca yapılır.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Android projesini oluştur
        run: |
          npm install --no-save --no-audit --no-fund @bubblewrap/core@1.27.0
          node android/generate.js

      - name: Android SDK bileşenlerini kur
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: AAB derle
        working-directory: build/twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sonucu android-build dalına koy
        run: |
          set -e
          out=/tmp/out
          mkdir -p "$out"
          cp build/twa/app/build/outputs/bundle/release/app-release.aab "$out/24-arena-unsigned.aab"
          merged=$(find build/twa/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -1)
          cp "$merged" "$out/AndroidManifest.merged.xml"
          echo "İzinler:"; grep -o 'uses-permission[^>]*' "$out/AndroidManifest.merged.xml" || echo "(izin yok)"
          sha1sum "$out/24-arena-unsigned.aab" | tee "$out/sha1.txt"
          echo "${GITHUB_SHA}" > "$out/source-commit.txt"
          echo '{"git":{"deploymentEnabled":false}}' > "$out/vercel.json"
          printf '# android-build\n\nBu dal GitHub Actions ile otomatik oluşturulur. İçindeki AAB imzasızdır.\n' > "$out/README.md"
          cd "$out"
          git init -q -b android-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "İmzasız Android paketi (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build
